name: Web CI — Build (Next.js)

on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: web-ci-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: espacecomedie
          POSTGRES_PASSWORD: espacecomedie
          POSTGRES_DB: espacecomedie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://espacecomedie:espacecomedie@localhost:5432/espacecomedie?schema=public
      DIRECT_URL: postgresql://espacecomedie:espacecomedie@localhost:5432/espacecomedie?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Build
        run: npm run build
