name: Web CD — Deploy

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: web-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_WEB_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_WEB_DEPLOY_HOOK_URL secret not configured, skipping deploy hook."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_WEB_DEPLOY_HOOK_URL"
