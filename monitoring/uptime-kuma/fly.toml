app = 'espace-comedie-kuma'
primary_region = 'cdg'

[build]
  image = 'louislam/uptime-kuma:2'

[mounts]
  source = 'kuma_data'
  destination = '/app/data'

[[services]]
  internal_port = 3001
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
